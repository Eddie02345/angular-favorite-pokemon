<div class="page-header">
  <div>
    <h1>My Favorite Pokémon</h1>
    <p>Pick a region to see my favorites, or shop at the PokéMart.</p>
  </div>
</div>

<div class="grid">
  @for (c of cards; track c.label) {
    <a class="card tile" [style.--accent]="c.color" [routerLink]="c.link">
      <span class="big">{{ c.emoji }}</span>
      <h2>{{ c.label }}</h2>
    </a>
  }
</div>
