<article class="card" [style.--accent]="accent()">
    <img class="sprite" [src]="image()" [alt]="pokemon().name" loading="lazy" />
  <header>
    <h3>
      {{ pokemon().emoji }} {{ pokemon().name }}
      <span class="type">{{ pokemon().type }}</span>
    </h3>
    <span class="badge">Held Item: {{ pokemon().heldItem }}</span>
  </header>

  <div class="panel">
    <p class="label">Description</p>
    {{ pokemon().description }}
  </div>
</article>
