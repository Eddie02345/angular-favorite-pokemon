<div class="card">
  <div class="top">
    <img class="sprite" [src]="image()" [alt]="item().name" loading="lazy" />
    <span class="badge">₽{{ item().price }}</span>
  </div>
  <h3>{{ item().emoji }} {{ item().name }}</h3>
  <div class="actions">
    <button class="btn primary" (click)="add.emit(item())">Add to Cart</button>
  </div>
</div>
